name: quarterly-harness-review

# -----------------------------------------------------------------
# Fights "DEPRECATION.md itself aging" (self-review P1 #9).
# `.kiro/steering/DEPRECATION.md § 1` commits to a quarterly
# review, but nothing reminded anyone. This workflow opens a
# tracking issue on the 1st of Feb / May / Aug / Nov at 10:00 UTC
# with the current list of Active entries and the 5-question
# review checklist.
#
# The issue is assigned to the CODEOWNERS steward.  It does NOT
# auto-retire anything; deciding is a human's job.
# -----------------------------------------------------------------

on:
  schedule:
    # Minute 0, hour 10, day 1, months Feb/May/Aug/Nov, any weekday.
    - cron: "0 10 1 2,5,8,11 *"
  # Manual trigger for testing or ad-hoc reviews.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not actually open an issue; print to logs instead"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose issue body
        id: compose
        run: |
          today=$(date -u +%Y-%m-%d)
          quarter=$(date -u +%Y-Q%q 2>/dev/null || date -u +%Y-%m)
          echo "today=$today"       >> "$GITHUB_OUTPUT"
          echo "quarter=$quarter"   >> "$GITHUB_OUTPUT"

          python3 - <<'PY' > body.md
          import re, pathlib, datetime

          path = pathlib.Path(".kiro/steering/DEPRECATION.md")
          text = path.read_text(encoding="utf-8")

          # Extract top-level numbered sections as candidate "Active entries".
          # Cheap and correct: each "## N. Title" after § 4 is an entry,
          # but we just enumerate them all for the human to triage.
          sections = re.findall(r"^##\s+\d+\.\s+(.+)$", text, re.MULTILINE)
          # Drop chapter headings that are prose-only (Maintainers, etc.).
          non_entry = {"维护者", "Maintainers"}
          sections = [s for s in sections if s.strip() not in non_entry]

          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          out = []
          out.append(f"# Harness review · {today}")
          out.append("")
          out.append("Automatic quarterly reminder from "
                     "`.github/workflows/quarterly-harness-review.yml`.")
          out.append("")
          out.append("See `.kiro/steering/DEPRECATION.md § 2` for the "
                     "5-question review flow. Short version:")
          out.append("")
          out.append("1. Does the failure mode still exist under the "
                     "current model?")
          out.append("2. Is there a looser formulation that achieves the "
                     "same effect?")
          out.append("3. Would removing it cause a new failure? Is there "
                     "a quantifiable signal?")
          out.append("4. Does tightening OR broadening have value?")
          out.append("5. What would replace it if retired?")
          out.append("")
          out.append("## Sections found in DEPRECATION.md")
          out.append("")
          if sections:
              for s in sections:
                  out.append(f"- [ ] `§ {s.strip()}`")
          else:
              out.append("_(no numbered entries found — did the file change format?)_")
          out.append("")
          out.append("## Actions for the steward")
          out.append("")
          out.append("- [ ] Walk through each entry above against the 5 questions.")
          out.append("- [ ] Open `harness-change` PR(s) for any retirements.")
          out.append("- [ ] Update DEPRECATION.md § 5/§ 6 with retirements / widening.")
          out.append("- [ ] Close this issue when done; next one opens automatically next quarter.")
          out.append("")
          out.append("---")
          out.append("")
          out.append("_Generated by "
                     "`.github/workflows/quarterly-harness-review.yml`. "
                     "To tune policy, see `.kiro/steering/DEPRECATION.md § 2`._")
          print("\n".join(out))
          PY

          echo "---"
          cat body.md
          echo "---"

      - name: Open issue (unless dry_run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Harness review: ${{ steps.compose.outputs.quarter }} (${{ steps.compose.outputs.today }})"
          gh issue create \
            --title "$title" \
            --label "harness-review" \
            --body-file body.md
